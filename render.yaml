services:
  - type: web
    name: job-queue-api
    runtime: node
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /jobs/counts
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: SQLITE_PATH
        value: /tmp/jobs.sqlite
